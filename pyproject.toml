[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nexusforge"
version = "0.1.0"
description = "Evidence-first research-to-product engineering platform. v0.1: reproducible protein structure retrieval, validation, and confidence analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NexusForge Contributors" }]
keywords = [
  "bioinformatics",
  "protein-structure",
  "alphafold",
  "scientific-computing",
  "reproducible-research",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Typing :: Typed",
]
dependencies = [
  "biopython>=1.83",
  "httpx>=0.27",
  "numpy>=1.26",
  "pydantic>=2.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.5",
]

[project.scripts]
nexusforge = "nexusforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nexusforge"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "network: hits live public APIs; disabled by default (set NEXUSFORGE_LIVE=1 to enable)",
]
filterwarnings = ["error::UserWarning:nexusforge.*"]

[tool.coverage.run]
source = ["src/nexusforge"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "C4",  # comprehensions
  "SIM", # simplify
  "RET", # return
  "ARG", # unused arguments
  "PTH", # pathlib
  "RUF", # ruff-specific
]
ignore = [
  "RUF001", # ambiguous unicode in strings (scientific notation)
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "ARG005", "B011"]
"src/nexusforge/cli.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["src/nexusforge"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
